<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生物発光 発光生物・発光機構クイズ</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .fade-in { animation: fadeIn 0.3s ease-in; }
  @keyframes fadeIn { from {opacity:0;transform:translateY(10px)} to {opacity:1;transform:translateY(0)} }
  .glow { box-shadow: 0 0 20px var(--glow-color, #22d3ee); animation: glowPulse 2s infinite; }
  @keyframes glowPulse { 0%,100%{box-shadow:0 0 10px var(--glow-color,#22d3ee)} 50%{box-shadow:0 0 25px var(--glow-color,#22d3ee)} }
  .choice-btn { transition: all 0.2s; }
  .choice-btn.correct { background:#166534 !important; border-color:#22c55e !important; }
  .choice-btn.wrong { background:#7f1d1d !important; border-color:#ef4444 !important; }
  .color-swatch { display:inline-block; width:48px; height:16px; border-radius:4px; vertical-align:middle; border:1px solid rgba(255,255,255,0.2); }
</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
<div class="max-w-xl mx-auto px-4 py-6">

  <header class="text-center mb-6">
    <div class="text-4xl mb-2">✨</div>
    <h1 class="text-2xl font-bold text-cyan-400">生物発光クイズ</h1>
    <p class="text-gray-400 text-sm mt-1">Bioluminescence Organism &amp; Mechanism Quiz</p>
  </header>

  <!-- Menu -->
  <div id="screen-menu" class="fade-in">
    <div class="bg-gray-800 rounded-xl p-5 mb-4">
      <h2 class="font-bold text-cyan-300 mb-4 text-center">クイズモードを選択</h2>
      <div class="grid gap-3 mb-4">
        <button onclick="startQuiz('organism')" class="bg-cyan-800 hover:bg-cyan-700 py-3 px-4 rounded-xl text-left transition font-bold" aria-label="生物名当てクイズを開始">
          <div>🦠 生物名当てクイズ</div>
          <div class="text-xs text-cyan-200 font-normal mt-1">説明から発光生物を4択で当てる</div>
        </button>
        <button onclick="startQuiz('mechanism')" class="bg-purple-800 hover:bg-purple-700 py-3 px-4 rounded-xl text-left transition font-bold" aria-label="発光機構マッチングを開始">
          <div>⚗️ 発光機構マッチング</div>
          <div class="text-xs text-purple-200 font-normal mt-1">生化学的経路と生物を対応付ける</div>
        </button>
        <button onclick="startQuiz('truefalse')" class="bg-green-800 hover:bg-green-700 py-3 px-4 rounded-xl text-left transition font-bold" aria-label="○×クイズを開始">
          <div>⭕ ○×クイズ</div>
          <div class="text-xs text-green-200 font-normal mt-1">生物発光に関する事実の正誤判定</div>
        </button>
      </div>
    </div>
    <div class="bg-gray-800 rounded-xl p-4" role="region" aria-label="ハイスコア">
      <h2 class="text-cyan-400 font-bold mb-3">ハイスコア</h2>
      <div id="hs-display" class="grid grid-cols-3 gap-3 text-center text-sm"></div>
    </div>
  </div>

  <!-- Quiz Screen -->
  <div id="screen-quiz" class="hidden fade-in">
    <div class="flex justify-between items-center mb-4">
      <button onclick="goMenu()" class="text-gray-400 hover:text-white transition" aria-label="メニューに戻る">← メニュー</button>
      <div class="text-sm flex gap-4">
        <span>問題: <strong id="q-num" class="text-cyan-400">1</strong>/20</span>
        <span>スコア: <strong id="q-score" class="text-yellow-400">0</strong></span>
      </div>
    </div>
    <div class="bg-gray-700 rounded-full h-1.5 mb-4">
      <div id="progress-bar" class="bg-cyan-500 h-1.5 rounded-full transition-all duration-300" style="width:0%"></div>
    </div>

    <div class="bg-gray-800 rounded-xl p-5 mb-4">
      <div id="q-mode-label" class="text-xs text-gray-400 mb-2 uppercase tracking-wider"></div>
      <div id="q-text" class="text-sm text-gray-200 leading-relaxed mb-4"></div>
      <div id="q-choices" class="grid gap-3" role="group" aria-label="選択肢"></div>
    </div>

    <div id="answer-panel" class="hidden bg-gray-800 rounded-xl p-4 mb-3 fade-in" role="region" aria-live="polite">
      <div id="ans-verdict" class="font-bold mb-3 text-lg"></div>
      <!-- Wavelength / Color swatch -->
      <div id="wavelength-info" class="hidden bg-gray-700 rounded-lg p-3 mb-3">
        <div class="flex items-center gap-3">
          <div>
            <div class="text-xs text-gray-400">発光波長</div>
            <div id="wl-nm" class="text-lg font-bold text-cyan-300"></div>
          </div>
          <div>
            <div class="text-xs text-gray-400">発光色</div>
            <div id="wl-swatch" class="color-swatch mt-1"></div>
          </div>
          <div class="flex-1 text-xs text-gray-300" id="wl-desc"></div>
        </div>
      </div>
      <div id="ans-detail" class="text-sm text-gray-300 leading-relaxed mb-3"></div>
      <button onclick="nextQuestion()" id="next-btn" class="w-full bg-cyan-700 hover:bg-cyan-600 py-2 rounded-lg font-bold transition">次の問題 →</button>
    </div>
  </div>

  <!-- Result Screen -->
  <div id="screen-result" class="hidden fade-in text-center">
    <div class="bg-gray-800 rounded-xl p-8 mb-4">
      <div id="res-emoji" class="text-5xl mb-3"></div>
      <h2 class="text-xl font-bold mb-2">クイズ終了！</h2>
      <div id="res-score" class="text-4xl font-bold text-yellow-400 mb-1"></div>
      <div id="res-detail" class="text-gray-400 text-sm mb-2"></div>
      <div id="res-new" class="hidden text-green-400 font-bold">🎉 新記録！</div>
    </div>
    <button onclick="goMenu()" class="w-full bg-cyan-700 hover:bg-cyan-600 py-3 rounded-xl font-bold transition">メニューに戻る</button>
  </div>

</div>

  { q:'生物発光と生物蛍光は同じ現象である。', a:false, fact:'生物発光は化学反応で光を「産生」する。生物蛍光は外部の光を吸収して別の波長で「放射」する。サンゴの蛍光は後者の例。' },
  { q:'ホタルイカの発光器は全身に分布しており、腹側に特に多い。', a:true, fact:'ホタルイカは全身に約1000個の発光器を持ち、腹側に集中。これはカウンターイルミネーション（逆照明偽装）に使われる。' },
  { q:'生物発光は陸上生物にのみ見られ、深海生物では発光しない。', a:false, fact:'深海生物の推定50〜90%が何らかの形で発光能力を持つとされる。生物発光は陸上より海洋・深海で圧倒的に多様。' },
  { q:'ATP（アデノシン三リン酸）はホタルの発光反応に必須である。', a:true, fact:'ホタルのルシフェラーゼはルシフェリンをATPとMg²⁺の存在下で酸化する。この反応がATPアッセイキットとして広く利用される。' },
];

let qState = { mode: null, questions: [], current: 0, score: 0, correct: 0, answered: false };

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function startQuiz(mode) {
  qState.mode = mode;
  qState.score = 0;
  qState.correct = 0;
  qState.current = 0;
  qState.answered = false;
  if (mode === 'truefalse') {
    qState.questions = shuffle(TRUE_FALSE).slice(0, 20);
  } else {
    qState.questions = shuffle(ORGANISMS).slice(0, 20);
  }
  document.getElementById('q-score').textContent = '0';
  document.getElementById('q-num').textContent = '1';
  document.getElementById('progress-bar').style.width = '0%';
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = qState.questions[qState.current];
  document.getElementById('q-num').textContent = qState.current + 1;
  document.getElementById('progress-bar').style.width = ((qState.current / 20) * 100) + '%';
  document.getElementById('answer-panel').classList.add('hidden');
  document.getElementById('q-choices').innerHTML = '';  // xss-ok: reviewed-internal-data
  qState.answered = false;

  if (qState.mode === 'organism') {
    document.getElementById('q-mode-label').textContent = '生物名当てクイズ';
    document.getElementById('q-text').innerHTML = `<p class="mb-2">${q.desc}</p><p class="text-xs text-gray-400">発光機構: ${q.mechanism}</p>`; // xss-ok: internal constant
    const choices = shuffle(ORGANISMS.filter(o => o.name !== q.name)).slice(0,3).concat([q]);
    makeChoiceButtons(shuffle(choices), q, o => o.name, o => `${o.emoji} ${o.name}（${o.en}）`);
  } else if (qState.mode === 'mechanism') {
    document.getElementById('q-mode-label').textContent = '発光機構マッチング';
    document.getElementById('q-text').textContent = `「${q.name}」の発光機構はどれか？`;
    const choices = shuffle(ORGANISMS.filter(o => o.name !== q.name)).slice(0,3).concat([q]);
    makeChoiceButtons(shuffle(choices), q, o => o.mechanism, o => o.mechanism);
  } else {
    document.getElementById('q-mode-label').textContent = '○×クイズ';
    document.getElementById('q-text').textContent = q.q;
    makeTrueFalseButtons(q);
  }
}

function makeChoiceButtons(choices, correct, keyFn, labelFn) {
  const container = document.getElementById('q-choices');
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn bg-gray-700 hover:bg-gray-600 border-2 border-gray-600 rounded-xl py-3 px-4 text-sm text-left transition';
    btn.textContent = labelFn(c);
    btn.setAttribute('aria-label', `選択肢: ${labelFn(c)}`);
    btn.addEventListener('click', () => {
      if (qState.answered) return;
      qState.answered = true;
      const isCorrect = keyFn(c) === keyFn(correct);
      selectAnswer(isCorrect, correct, choices, btn, keyFn);
    });
    container.appendChild(btn);
  });
}

function makeTrueFalseButtons(q) {
  const container = document.getElementById('q-choices');
  const grid = document.createElement('div');
  grid.className = 'grid grid-cols-2 gap-3';
  [true, false].forEach(val => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn bg-gray-700 hover:bg-gray-600 border-2 border-gray-600 rounded-xl py-4 px-4 text-lg font-bold text-center transition';
    btn.textContent = val ? '⭕ 正しい' : '❌ 間違い';
    btn.setAttribute('aria-label', val ? '正しい' : '間違い');
    btn.addEventListener('click', () => {
      if (qState.answered) return;
      qState.answered = true;
      const isCorrect = val === q.a;
      grid.querySelectorAll('button').forEach(b => {
        b.disabled = true;
        const bVal = b.textContent.includes('⭕');
        if (bVal === q.a) b.classList.add('correct');
        else if (bVal !== q.a && !isCorrect && bVal === val) b.classList.add('wrong');
      });
      if (isCorrect) { qState.score += 10; qState.correct++; document.getElementById('q-score').textContent = qState.score; }
      showAnswer(isCorrect, null, q.fact, null, null);
    });
    grid.appendChild(btn);
  });
  container.appendChild(grid);
}

function selectAnswer(isCorrect, correct, choices, selectedBtn, keyFn) {
  document.getElementById('q-choices').querySelectorAll('button').forEach((btn, i) => {
    btn.disabled = true;
    if (keyFn(choices[i]) === keyFn(correct)) btn.classList.add('correct');
    else if (btn === selectedBtn && !isCorrect) btn.classList.add('wrong');
  });
  if (isCorrect) { qState.score += 10; qState.correct++; document.getElementById('q-score').textContent = qState.score; }
  showAnswer(isCorrect, correct, null, correct?.wavelength, correct?.color);
}

function showAnswer(isCorrect, organism, tfFact, wavelength, color) {
  document.getElementById('ans-verdict').innerHTML = isCorrect ? '<span class="text-green-400">✓ 正解！</span>' : '<span class="text-red-400">✗ 不正解</span>'; // xss-ok: internal constant
  const wlPanel = document.getElementById('wavelength-info');
  if (wavelength && color) {
    wlPanel.classList.remove('hidden');
    document.getElementById('wl-nm').textContent = wavelength + ' nm';
    document.getElementById('wl-swatch').style.background = color;
    document.getElementById('wl-swatch').style.boxShadow = `0 0 8px ${color}`;
    document.getElementById('wl-desc').textContent = organism ? organism.colorName : '';
  } else {
    wlPanel.classList.add('hidden');
  }
  document.getElementById('ans-detail').textContent = organism ? organism.fact : tfFact;
  if (qState.current >= 19) document.getElementById('next-btn').textContent = '結果を見る';
  document.getElementById('answer-panel').classList.remove('hidden');
}

function nextQuestion() {
  qState.current++;
  if (qState.current >= 20) { showResult(); return; }
  renderQuestion();
}

function showResult() {
  const pct = Math.round(qState.correct / 20 * 100);
  const emoji = pct >= 80 ? '✨' : pct >= 60 ? '💫' : pct >= 40 ? '🌟' : '🌑';
  document.getElementById('res-emoji').textContent = emoji;
  document.getElementById('res-score').textContent = qState.score + ' 点';
  document.getElementById('res-detail').textContent = `20問中 ${qState.correct}問正解 (${pct}%)`;
  const isNew = saveHS(qState.mode, qState.score);
  document.getElementById('res-new').classList.toggle('hidden', !isNew);
  showScreen('result');
}

function getHS() { try { return JSON.parse(localStorage.getItem('biolum_hs') || '{}'); } catch { return {}; } }
function saveHS(mode, score) { const h = getHS(); const isNew = !h[mode] || score > h[mode]; if (isNew) { h[mode] = score; localStorage.setItem('biolum_hs', JSON.stringify(h)); } return isNew; }
function renderHS() {
  const h = getHS();
  const modes = [{k:'organism',l:'生物名'},{k:'mechanism',l:'機構'},{k:'truefalse',l:'○×'}];
  document.getElementById('hs-display').innerHTML = modes.map(m => `<div class="bg-gray-800 rounded-lg py-2 border border-gray-700"><div class="text-xs text-gray-400">${m.l}</div><div class="text-lg font-bold text-cyan-400">${h[m.k]||0}</div></div>`).join(''); // xss-ok: internal constant, computed
}

function showScreen(id) {
  ['menu','quiz','result'].forEach(s => document.getElementById('screen-'+s).classList.toggle('hidden', s !== id));
}
function goMenu() { showScreen('menu'); renderHS(); }

renderHS();
</script>
